{% extends "base.html" %}
{% block title %}{{ t('2fa.setup_title') }}{% endblock %}
{% block content %}
<section class="card narrow">
  <p><a href="/account">&larr; {{ t('account.title') }}</a></p>
  <h1>{{ t('2fa.setup_email_title') }}</h1>
  {% if error %}<p class="error">{{ t(error) }}</p>{% endif %}
  <p>{{ t('2fa.email_sent', email=user.email) }}</p>
  <form method="post" action="/account/2fa/email">
    <label>{{ t('field.code') }}<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required autofocus></label>
    <button class="primary">{{ t('2fa.enable') }}</button>
  </form>
  <form method="post" action="/account/2fa/email/start">
    <button>{{ t('login2fa.resend') }}</button>
  </form>
</section>
{% endblock %}
