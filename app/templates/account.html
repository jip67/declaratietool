{% extends "base.html" %}
{% block title %}{{ t('account.title') }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ t('account.title') }}</h1>
  {% if message %}<p class="success">{{ t(message) }}</p>{% endif %}
  {% if error %}<p class="error">{{ t(error) }}</p>{% endif %}
  <form method="post" action="/account">
    <label>{{ t('field.name') }}<input name="name" value="{{ user.name }}" required></label>
    <label>{{ t('field.language') }}
      <select name="language">{% for code in languages %}<option value="{{ code }}" {% if code == user.language %}selected{% endif %}>{{ t('lang.' ~ code) }}</option>{% endfor %}</select>
    </label>
    <h2>{{ t('account.change_password') }}</h2>
    <label>{{ t('account.current_password') }}<input type="password" name="current_password" autocomplete="current-password"></label>
    <label>{{ t('account.new_password') }}<input type="password" name="new_password" minlength="10" autocomplete="new-password"></label>
    <button class="primary">{{ t('action.save') }}</button>
  </form>
</section>
{% endblock %}
