{% extends "base.html" %}
{% block title %}{{ t('login.title') }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ t('login.title') }}</h1>
  {% if error %}<p class="error">{{ t(error) }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>{{ t('field.email') }}<input type="email" name="email" required autofocus></label>
    <label>{{ t('field.password') }}<input type="password" name="password" required></label>
    <button class="primary">{{ t('login.submit') }}</button>
  </form>
</section>
{% endblock %}
